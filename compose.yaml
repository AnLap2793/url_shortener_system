x-application: &application
  image: url-shortener-local
  build:
    context: .
    dockerfile: Dockerfile

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-url_shortener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-url_shortener}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  migrate:
    <<: *application
    command: ["node", "packages/db/dist/migrate-cli.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-url_shortener}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-url_shortener}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    <<: *application
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-url_shortener}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-url_shortener}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      NODE_ENV: development
      PORT: "3000"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:3000}
      WEB_DIST_DIR: /app/apps/web/dist
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    init: true
    restart: unless-stopped

  worker:
    <<: *application
    profiles: ["worker"]
    command: ["node", "apps/worker/dist/main.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-url_shortener}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-url_shortener}
      NODE_ENV: development
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-capture}
      EMAIL_FROM: ${EMAIL_FROM:-URL Shortener <verify@example.com>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
